####################################################################################################
# Docker Compose Build - Multi-App
# 
# Purpose: Build SIIMUT, IKP, and IAM Server images with a single manifest.
# Use build.sh for tagging and Docker Hub push.
####################################################################################################

services:
  ####################################################################################################
  # SIIMUT Build Service
  ####################################################################################################
  siimut:
    build:
      context: ..
      dockerfile: apps/siimut/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
        TZ: "Asia/Jakarta"
        APP_NAME: "SIIMUT Application"
        APP_ENV: "production"
        APP_DIR: "siimut"
        DB_HOST: "database-service"
        DB_USERNAME: "siimut_user"
        DB_PASSWORD: "siimut-password"
        DB_DATABASE: "siimut_db"
        AWS_ACCESS_KEY_ID: "admin"
        AWS_SECRET_ACCESS_KEY: "password"
        AWS_BUCKET: "siimut"
        AWS_URL: "http://minio:9090/siimut"
        AWS_ENDPOINT: "http://minio:9000"
        BUILD_TIMESTAMP: "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        DB_DUMP_DISABLE_SSL: true
        DB_DUMP_TIMEOUT: 3600
        DB_DUMP_EXTRA_OPTION: "--ssl=0"
    image: siimut:${SIIMUT_VERSION:-latest}
    pull_policy: never

  ####################################################################################################
  # IKP Build Service
  ####################################################################################################
  ikp:
    build:
      context: ..
      dockerfile: apps/ikp/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
        TZ: "Asia/Jakarta"
        APP_NAME: "IKP Application"
        APP_ENV: "local"
        APP_DEBUG: true
        APP_DIR: "ikp"
        DB_HOST: "database-service"
        DB_USERNAME: "ikp_user"
        DB_PASSWORD: "ikp-password"
        DB_DATABASE: "ikp_db"
        AWS_ACCESS_KEY_ID: "admin"
        AWS_SECRET_ACCESS_KEY: "password"
        DEBUGBAR_ENABLED: true
        AWS_BUCKET: "ikp"
        AWS_URL: "http://minio:9090/ikp"
        AWS_ENDPOINT: "http://minio:9000"
        BUILD_TIMESTAMP: "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    image: ikp:${IKP_VERSION:-latest}
    pull_policy: never

  ####################################################################################################
  # IAM Server Build Service
  ####################################################################################################
  iam-server:
    build:
      context: ..
      dockerfile: apps/iam/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
        TZ: "Asia/Jakarta"
        APP_NAME: "IAM Server"
        APP_ENV: "production"
        APP_DIR: "iam-server"
        BUILD_TIMESTAMP: "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    image: iam-server:${IAM_VERSION:-latest}
    pull_policy: never

  ####################################################################################################
  # Learning Management System berbasis Laravel yang dikustomisasi untuk kebutuhan internal institusi kesehatan
  ####################################################################################################
  lms:
    build:
      context: ..
      dockerfile: apps/lms/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
        TZ: "Asia/Jakarta"
        APP_NAME: "Learning Management System berbasis Laravel yang dikustomisasi untuk kebutuhan internal institusi kesehatan"
        APP_ENV: "production"
        APP_DIR: "lms-app"
        DB_HOST: "database-service"
        DB_USERNAME: "lms_user"
        DB_PASSWORD: "lms_pass123"
        DB_DATABASE: "lms_db"
        AWS_ACCESS_KEY_ID: "admin"
        AWS_SECRET_ACCESS_KEY: "password"
        AWS_BUCKET: "lms"
        AWS_URL: "http://minio:9090/lms"
        AWS_ENDPOINT: "http://minio:9000"
        BUILD_TIMESTAMP: "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    image: lms:${LMS_VERSION:-latest}
    pull_policy: never

  ####################################################################################################
  #  RBV - Ruang Baca Virtual Platform
  ####################################################################################################
  rbv:
    build:
      context: ..
      dockerfile: apps/rbv/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
        TZ: "Asia/Jakarta"
        APP_NAME: " RBV - Ruang Baca Virtual Platform"
        APP_ENV: "production"
        APP_DIR: "rbv-app"
        DB_HOST: "database-service"
        DB_USERNAME: "rbv_user"
        DB_PASSWORD: "rbv_pass123"
        DB_DATABASE: "rbv_db"
        AWS_ACCESS_KEY_ID: "admin"
        AWS_SECRET_ACCESS_KEY: "password"
        AWS_BUCKET: "rbv"
        AWS_URL: "http://minio:9090/rbv"
        AWS_ENDPOINT: "http://minio:9000"
        BUILD_TIMESTAMP: "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    image: rbv:${RBV_VERSION:-latest}
    pull_policy: never


  ####################################################################################################
  # Smartpresence Deskripsi
  ####################################################################################################
  smsp:
    build:
      context: ..
      dockerfile: apps/smsp/be.Dockerfile
      args:
        UID: "1000"
        GID: "1000"
        TZ: "Asia/Jakarta"

        APP_NAME: "Smartpresence Deskripsi"
        APP_ENV: "production"
        APP_DIR: "smsp/be"

        DB_HOST: "database-service"
        DB_USERNAME: "smsp_user"
        DB_PASSWORD: "smsp_password"
        DB_DATABASE: "smsp_db"

        AWS_ACCESS_KEY_ID: "admin"
        AWS_SECRET_ACCESS_KEY: "password"
        AWS_BUCKET: "smsp"
        AWS_URL: "http://minio:9090/smsp"
        AWS_ENDPOINT: "http://minio:9000"

        BUILD_TIMESTAMP: "${BUILD_TIMESTAMP:-manual}"
    image: smsp:${SMSP_VERSION:-v1.0.0}
    pull_policy: never

  # Frontend Compose
  fe-smsp:
    image: ${FE_SMSP_IMAGE:-fe-smsp:v1.0.1}
    build:
      context: ../sources/smsp/fe
      dockerfile: ../../../apps/smsp/fe.Dockerfile
      additional_contexts:
        nginx_infra: ../docker/nginx
      args:
        APP_NAME: fe-smsp
        VITE_APP_NAME: SMSP
        VITE_API_URL: VITE_API_URL_PLACEHOLDER
        VITE_USE_SSO: VITE_USE_SSO_PLACEHOLDER
        VITE_SSO_URL: VITE_SSO_URL_PLACEHOLDER

  ####################################################################################################
  # template-1 - Laravel Application
  ####################################################################################################
  template-1:
    build:
      context: ..
      dockerfile: apps/template-1/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
        TZ: "Asia/Jakarta"

        APP_NAME: "template-1 - Laravel Application"
        APP_ENV: "production"
        APP_DIR: "template-1"

        DB_HOST: "database-service"
        DB_USERNAME: "template1_user"
        DB_PASSWORD: "template1_password"
        DB_DATABASE: "template1_db"

        AWS_ACCESS_KEY_ID: "admin"
        AWS_SECRET_ACCESS_KEY: "password"
        AWS_BUCKET: "template-1"
        AWS_URL: "http://minio:9090/template-1"
        AWS_ENDPOINT: "http://minio:9090"

        BUILD_TIMESTAMP: "${BUILD_TIMESTAMP:-manual}"
    image: juniyasyos/template-1:${TEMPLATE_1_VERSION:-v1.0.0}
    pull_policy: never
