name: rsch-srv

services:
  ####################################################################################################
  # Storage s3 (Minio)
  ####################################################################################################
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-password}"
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9090}:9090"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9091}:9091"   # Console UI
    command:
      - server
      - /data
      - --address
      - ":9090"
      - --console-address
      - ":9091"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.15"
    healthcheck:
      # since MinIO now listens on 9090 inside container
      test: ["CMD-SHELL", "curl -f http://localhost:9090/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - default

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
      - MINIO_BUCKETS=${MINIO_BUCKETS:-siimut,ikp,data-center}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Menunggu MinIO siap..."
        sleep 2

        echo "🔧 Mengonfigurasi mc alias..."
        mc alias set myminio http://minio:9090 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" --api S3v4

        OLD_IFS="$$IFS"
        IFS=','
        set -f
        for bucket in $${MINIO_BUCKETS}; do
          bucket="$${bucket}"
          echo "📦 Memeriksa bucket '$${bucket}'..."
          if mc ls myminio/$${bucket} >/dev/null 2>&1; then
            echo "✅ Bucket '$${bucket}' sudah ada"
          else
            echo "🆕 Membuat bucket '$${bucket}'..."
            mc mb myminio/$${bucket}
            echo "✅ Bucket '$${bucket}' berhasil dibuat"
          fi
          echo "🔓 Mengatur policy PUBLIC (download) untuk bucket..."
          mc anonymous set download myminio/$${bucket}
          echo "✅ Bucket '$${bucket}' dapat diakses publik"
        done
        set +f
        IFS="$$OLD_IFS"
        echo "✨ Inisialisasi MinIO selesai!"
    networks:
      - default
    restart: "no"

  ####################################################################################################
  # DATABASE (MySQL) - Production Optimized
  ####################################################################################################
  db:
    image: mysql:8.0
    container_name: database-service
    restart: unless-stopped
    # ports:
    #   - "${DB_PORT:-3306}:3306"  # tetap dikomentari untuk production
    volumes:
      - db_data:/var/lib/mysql
      - db_logs:/var/log/mysql
      - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/db/sql:/docker-entrypoint-initdb.d:ro
      - ./docker/db/save/:/etc/mysql/save/
    env_file:
      - ./env/common.env
    environment:
      # Hanya yang penting saja, database & user akan dibuat dari script SQL
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_RANDOM_ROOT_PASSWORD: "no"
      # MySQL 8.0 compatibility settings
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      # Disable strict mode untuk kompatibilitas dengan aplikasi legacy
      MYSQL_INIT_CONNECT: "SET SESSION sql_mode=''"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "1"
    command:
      - --max-connections=60
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s 
  
  ####################################################################################################
  # phpMyAdmin - Development/Staging Tool (Keep as requested)
  ####################################################################################################
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    # profiles:
    #   - dev # Only start with --profile dev
    ports:
      - "${PMA_PORT:-8888}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_ABSOLUTE_URI: http://localhost:${PMA_PORT:-8888}/
      # Security
      PMA_BLOWFISH_SECRET: password
      # MySQL specific settings
      MYSQL_ROOT_PASSWORD: rootpass123
      # Enhanced limits for production data
      UPLOAD_LIMIT: 1024M
      MEMORY_LIMIT: 1024M
      POST_MAX_SIZE: 1024M
      MAX_EXECUTION_TIME: 600
      MAX_INPUT_TIME: 600
      MAX_INPUT_VARS: 10000
    volumes:
      - phpmyadmin_sessions:/sessions
      # Removed config file mount to avoid permission issues
      # - ./DockerNew/phpmyadmin/config.inc.php:/etc/phpmyadmin/config.inc.php:ro
    # Removed user specification to avoid permission issues with mounted volumes
    # user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    # Resource limits for phpMyAdmin
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.05"

    ####################################################################################################
  
  # Docker Container Management UI (Portainer)
  ####################################################################################################
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    command:
      - --admin-password-file
      - /run/secrets/portainer_admin_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./portainer_admin_password.txt:/run/secrets/portainer_admin_password:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"
        reservations:
          memory: 128M
          cpus: "0.1"
          
volumes:
  minio_data:

  portainer_data:

  db_data:
    driver: local
  db_logs:
    driver: local

  phpmyadmin_sessions:
    driver: local
    
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
