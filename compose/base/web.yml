# Nginx Web Server — Multi-App Reverse Proxy
# Serves all Laravel applications on their respective ports.
#
# ╔══════════════════════════════════════════════════════════╗
# ║  App Registry                                           ║
# ║  Add new app here: name + port + volume paths           ║
# ║  Then add its port/volume entries in x-web-* below      ║
# ╚══════════════════════════════════════════════════════════╝
x-apps: &apps
  siimut: { port: 8000 }
  iam:    { port: 8100 }
  ikp:    { port: 8200 }
  lms:    { port: 7100 }
  smsp:   { port: 7200 }
  rbv:    { port: 7300 }

x-web-ports: &web-ports
  - "${WEB_PORTAL_PORT:-1000}:1000"
  - "${SIIMUT_HOST_PORT:-8000}:8000"
  - "${IAM_HOST_PORT:-8100}:8100"
  - "${IKP_HOST_PORT:-8200}:8200"
  - "${LMS_HOST_PORT:-7100}:7100"
  - "${SMSP_HOST_PORT:-7200}:7200"
  - "${RBV_HOST_PORT:-7300}:7300"

x-web-volumes: &web-volumes
  - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  - ../../docker/nginx/conf.d:/etc/nginx/conf.d:ro
  - ../../docker/nginx/html:/usr/share/nginx/html:ro
  # Application public/storage mounts (read-only)
  - siimut_public:/var/www/siimut/public:ro
  - siimut_storage:/var/www/siimut/storage:ro
  - ikp_public:/var/www/ikp/public:ro
  - ikp_storage:/var/www/ikp/storage:ro
  - iam_public:/var/www/iam/public:ro
  - lms_public:/var/www/lms-app/public:ro
  - lms_storage:/var/www/lms-app/storage:ro
  - rbv_public:/var/www/rbv/public:ro
  - rbv_storage:/var/www/rbv/storage:ro
  # - smsp_public:/var/www/smsp/public:ro
  # - smsp_storage:/var/www/smsp/storage:ro
  - nginx_logs:/var/log/nginx

services:
  web:
    image: nginx:alpine
    container_name: ${STACK_NAME:-multi}-web
    ports: *web-ports
    volumes: *web-volumes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  siimut_public:
    driver: local
  siimut_storage:
    driver: local
  ikp_public:
    driver: local
  ikp_storage:
    driver: local
  iam_public:
    driver: local
  lms_public:
    driver: local
  lms_storage:
    driver: local
  rbv_public:
    driver: local
  rbv_storage:
    driver: local
  nginx_logs:
    driver: local
