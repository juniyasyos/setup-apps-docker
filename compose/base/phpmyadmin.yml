# phpMyAdmin — Web-based MySQL Administration

services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:${PMA_PORT:-8888}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_ABSOLUTE_URI: http://localhost:${PMA_PORT:-8888}/
      PMA_BLOWFISH_SECRET: ${PMA_BLOWFISH_SECRET:-c8e9f2a4b1d6e3f5a7c0b2d4e6f8a1c3}
      UPLOAD_LIMIT: 1024M
      MEMORY_LIMIT: 1024M
      POST_MAX_SIZE: 1024M
      MAX_EXECUTION_TIME: 600
      MAX_INPUT_TIME: 600
      MAX_INPUT_VARS: 10000
    volumes:
      - phpmyadmin_sessions:/sessions
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${DEPLOY_MEMORY_LIMIT:-512M}
          cpus: "${DEPLOY_CPUS_LIMIT:-1}"
        reservations:
          memory: 128M
          cpus: "0.05"

volumes:
  phpmyadmin_sessions:
    driver: local
