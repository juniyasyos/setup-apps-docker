# Learning Management System berbasis Laravel yang dikustomisasi untuk kebutuhan internal institusi kesehatan
name: service-lms

services:
  app:
    extends:
      file: ../base/php-base.yml
      service: php-app-base
    image: juniyasyos/lms:latest
    container_name: lms-app
    working_dir: /var/www/lms-app
    env_file:
      - ../../apps/lms/.env.example
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_WORKDIR: /var/www/lms-app
      PUBLIC_VOLUME: /var/www/lms-app/public
      APP_URL: "http://192.168.1.4:8080"
      TRUSTED_PROXIES: "*"
      DB_HOST: database-service
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_pass123
      DB_DATABASE: lms_db
      SKIP_PUBLIC_SYNC: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_BUCKET: lms
      AWS_URL: http://192.168.1.4:9090/lms
      AWS_ENDPOINT: http://minio:9090
    volumes:
      - lms_storage:/var/www/lms-app/storage
      - lms_bootstrap_cache:/var/www/lms-app/bootstrap/cache
      - lms_public:/var/www/lms-app/public
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 512M
          cpus: "0.5"

  queue:
    extends:
      file: ../base/php-base.yml
      service: php-worker-base
    image: juniyasyos/lms:latest
    container_name: lms-queue
    working_dir: /var/www/lms-app
    env_file:
      - ../../apps/lms/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_pass123
    volumes:
      - lms_storage:/var/www/lms-app/storage
      - lms_bootstrap_cache:/var/www/lms-app/bootstrap/cache
    command: >
      artisan queue:work
        --sleep=5
        --tries=3
        --timeout=120
        --max-jobs=500
        --max-time=3600
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  scheduler:
    extends:
      file: ../base/php-base.yml
      service: php-scheduler-base
    image: juniyasyos/lms:latest
    container_name: lms-scheduler
    working_dir: /var/www/lms-app
    env_file:
      - ../../apps/lms/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_pass123
    volumes:
      - lms_storage:/var/www/lms-app/storage
      - lms_bootstrap_cache:/var/www/lms-app/bootstrap/cache
    command: >
      artisan schedule:work
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"
