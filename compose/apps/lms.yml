# Learning Management System berbasis Laravel yang dikustomisasi untuk kebutuhan internal institusi kesehatan
name: service-lms

services:
  app:
    extends:
      file: ../base/php-base.yml
      service: php-app-base
    image: lms:v1.0.0
    container_name: lms-app
    working_dir: /var/www/lms
    env_file:
      - ../../apps/lms/.env.example
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_WORKDIR: /var/www/lms
      PUBLIC_VOLUME: /var/www/lms/public
      APP_URL: "http://${HOST_IP}:7100"
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: database-service
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_pass123
      DB_DATABASE: lms_db
      SKIP_PUBLIC_SYNC: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_BUCKET: lms
      AWS_URL: http://${HOST_IP}:9090/lms
      AWS_ENDPOINT: http://minio:9090
    volumes:
      - lms_storage:/var/www/lms/storage
      - lms_bootstrap_cache:/var/www/lms/bootstrap/cache
      - lms_public:/var/www/lms/public
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 1G
          cpus: "1"

  queue:
    extends:
      file: ../base/php-base.yml
      service: php-worker-base
    image: lms:v1.0.0
    container_name: lms-queue
    working_dir: /var/www/lms
    env_file:
      - ../../apps/lms/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_pass123
    volumes:
      - lms_storage:/var/www/lms/storage
      - lms_bootstrap_cache:/var/www/lms/bootstrap/cache
    command: >
      artisan queue:work
        --sleep=5
        --tries=3
        --timeout=120
        --max-jobs=500
        --max-time=3600
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.5"

  scheduler:
    extends:
      file: ../base/php-base.yml
      service: php-scheduler-base
    image: lms:v1.0.0
    container_name: lms-scheduler
    working_dir: /var/www/lms
    env_file:
      - ../../apps/lms/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_pass123
    volumes:
      - lms_storage:/var/www/lms/storage
      - lms_bootstrap_cache:/var/www/lms/bootstrap/cache
    command: >
      artisan schedule:work
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.4"
        reservations:
          memory: 128M
          cpus: "0.2"
