# Smartpresence Deskripsi
name: service-smsp

services:
  app:
    extends:
      file: ../base/php-base.yml
      service: php-app-base
    image: smsp:v1.0.0
    container_name: smsp-app
    working_dir: /var/www/smsp
    env_file:
      - ../../apps/smsp/.env.example
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_WORKDIR: /var/www/smsp
      PUBLIC_VOLUME: /var/www/smsp/public
      APP_URL: "http://${HOST_IP:-localhost}:7200"
      SANCTUM_STATEFUL_DOMAINS: "${HOST_IP:-localhost}:7250,${HOST_IP:-localhost}:7200,localhost,127.0.0.1,127.0.0.1:7250"
      TRUSTED_PROXIES: "*"

      DB_CONNECTION: mysql
      DB_HOST: database-service
      DB_USERNAME: smsp_user
      DB_PASSWORD: smsp_password
      DB_DATABASE: smsp_db

      # Jangan true kalau public volume masih perlu diisi ke shared volume Nginx.
      SKIP_PUBLIC_SYNC: "false"

      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_BUCKET: smsp
      AWS_URL: http://${HOST_IP:-localhost}:9090/smsp
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      USE_SSO: "false"
      IAM_ENABLED: "false"
      IAM_HOST: "http://${HOST_IP:-localhost}:${IAM_HOST_PORT:-8110}"
      IAM_BASE_URL: "http://${HOST_IP:-localhost}:${IAM_HOST_PORT:-8110}"
      IAM_ISSUER: "http://${HOST_IP:-localhost}:${IAM_HOST_PORT:-8110}"
      IAM_VERIFY_ENDPOINT: "http://web:8100/api/sso/verify"
      IAM_REFRESH_TOKEN_ENDPOINT: "http://web:8100/api/sso/token/refresh"
      IAM_BACKCHANNEL_USER_APPLICATIONS_ENDPOINT: "http://web:8100/api/users/applications/detail"
      IAM_BACKCHANNEL: "http://web:8100"
      IAM_LOGIN_ROUTE: "/sso/login"
      IAM_CALLBACK_ROUTE: "/sso/callback"
      IAM_DEFAULT_REDIRECT: "http://${HOST_IP:-localhost}:7250/dashboard"
      IAM_APP_KEY: "smartpresence-services"
      IAM_SYNC_ROLES: true
      IAM_UNIT_KERJA_MODEL: "App\\Models\\WorkUnit"
    volumes:
      - smsp_storage:/var/www/smsp/storage
      - smsp_bootstrap_cache:/var/www/smsp/bootstrap/cache
      - smsp_public:/var/www/smsp/public
    deploy:
      resources:
        limits:
          memory: ${DEPLOY_MEMORY_LIMIT:-1G}
          cpus: "${DEPLOY_CPUS_LIMIT:-1}"
        reservations:
          memory: 512M
          cpus: "1"

  queue:
    extends:
      file: ../base/php-base.yml
      service: php-worker-base
    image: smsp:v1.0.0
    container_name: smsp-queue
    working_dir: /var/www/smsp
    env_file:
      - ../../apps/smsp/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: smsp_user
      DB_PASSWORD: smsp_password
      DB_DATABASE: smsp_db
    volumes:
      - smsp_storage:/var/www/smsp/storage
      - smsp_bootstrap_cache:/var/www/smsp/bootstrap/cache
    command: >
      artisan queue:work
        --sleep=5
        --tries=3
        --timeout=120
        --max-jobs=500
        --max-time=3600
    deploy:
      resources:
        limits:
          memory: ${DEPLOY_MEMORY_LIMIT:-512M}
          cpus: "${DEPLOY_CPUS_LIMIT:-1}"
        reservations:
          memory: 256M
          cpus: "0.5"

  scheduler:
    extends:
      file: ../base/php-base.yml
      service: php-scheduler-base
    image: smsp:v1.0.0
    container_name: smsp-scheduler
    working_dir: /var/www/smsp
    env_file:
      - ../../apps/smsp/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: smsp_user
      DB_PASSWORD: smsp_password
      DB_DATABASE: smsp_db
    volumes:
      - smsp_storage:/var/www/smsp/storage
      - smsp_bootstrap_cache:/var/www/smsp/bootstrap/cache
    command: >
      artisan schedule:work
    deploy:
      resources:
        limits:
          memory: ${DEPLOY_MEMORY_LIMIT:-512M}
          cpus: "${DEPLOY_CPUS_LIMIT:-1}"
        reservations:
          memory: 128M
          cpus: "0.2"

volumes:
  smsp_public:
    external: true
    name: base_smsp_public

  smsp_storage:
    external: true
    name: base_smsp_storage

  smsp_bootstrap_cache:
    name: base_smsp_bootstrap_cache
