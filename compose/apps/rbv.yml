#  RBV - Ruang Baca Virtual Platform
name: service-rbv

services:
  app:
    extends:
      file: ../base/php-base.yml
      service: php-app-base
    image: rbv:v1.0.0
    container_name: rbv-app
    working_dir: /var/www/rbv
    env_file:
      - ../../apps/rbv/.env.example
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "true"
      APP_WORKDIR: /var/www/rbv
      PUBLIC_VOLUME: /var/www/rbv/public
      APP_URL: "http://${HOST_IP}:7300"
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: database-service
      DB_USERNAME: rbv_user
      DB_PASSWORD: rbv_pass123
      DB_DATABASE: rbv_db
      SKIP_PUBLIC_SYNC: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_BUCKET: rbv
      AWS_URL: http://${HOST_IP}:9090/rbv
      AWS_ENDPOINT: http://minio:9000
      USE_SSO: "true"
      IAM_ENABLED: "true"
      IAM_HOST: "http://${HOST_IP}:${IAM_HOST_PORT:-8110}"
      IAM_BASE_URL: "http://${HOST_IP}:${IAM_HOST_PORT:-8110}"
      IAM_ISSUER: "http://${HOST_IP}:${IAM_HOST_PORT:-8110}"
      IAM_VERIFY_ENDPOINT: "http://web:8100/api/sso/verify"
      IAM_REFRESH_TOKEN_ENDPOINT: "http://web:8100/api/sso/token/refresh"
      IAM_BACKCHANNEL_USER_APPLICATIONS_ENDPOINT: "http://web:8100/api/users/applications/detail"
      IAM_APP_KEY: rbv-services
      IAM_JWT_LEEWAY: "60"
      IAM_IDENTIFIER_FIELD: nip
      IAM_PRESERVE_SESSION_ID: true
      IAM_BACKCHANNEL_METHOD: jwt
      IAM_USER_SYNC_MODE: push
    volumes:
      - rbv_storage:/var/www/rbv/storage
      - rbv_bootstrap_cache:/var/www/rbv/bootstrap/cache
      - rbv_public:/var/www/rbv/public
    deploy:
      resources:
        limits:
          memory: ${DEPLOY_MEMORY_LIMIT:-1G}
          cpus: "${DEPLOY_CPUS_LIMIT:-1}"
        reservations:
          memory: 512M
          cpus: "1"

  queue:
    extends:
      file: ../base/php-base.yml
      service: php-worker-base
    image: rbv:v1.0.0
    container_name: rbv-queue
    working_dir: /var/www/rbv
    env_file:
      - ../../apps/rbv/.env.example
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database-service
      DB_USERNAME: rbv_user
      DB_PASSWORD: rbv_pass123
      DB_DATABASE: rbv_db
      IAM_IDENTIFIER_FIELD: nip
    volumes:
      - rbv_storage:/var/www/rbv/storage
      - rbv_bootstrap_cache:/var/www/rbv/bootstrap/cache
    command: >
      artisan queue:work
        --sleep=5
        --tries=3
        --timeout=120
        --max-jobs=500
        --max-time=3600
    deploy:
      resources:
        limits:
          memory: ${DEPLOY_MEMORY_LIMIT:-512M}
          cpus: "${DEPLOY_CPUS_LIMIT:-1}"
        reservations:
          memory: 256M
          cpus: "0.5"

  scheduler:
    extends:
      file: ../base/php-base.yml
      service: php-scheduler-base
    image: rbv:v1.0.0
    container_name: rbv-scheduler
    working_dir: /var/www/rbv
    env_file:
      - ../../apps/rbv/.env.example
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database-service
      DB_USERNAME: rbv_user
      DB_PASSWORD: rbv_pass123
      DB_DATABASE: rbv_db
      IAM_IDENTIFIER_FIELD: nip
    volumes:
      - rbv_storage:/var/www/rbv/storage
      - rbv_bootstrap_cache:/var/www/rbv/bootstrap/cache
    command: >
      artisan schedule:work
    deploy:
      resources:
        limits:
          memory: ${DEPLOY_MEMORY_LIMIT:-512M}
          cpus: "${DEPLOY_CPUS_LIMIT:-1}"
        reservations:
          memory: 128M
          cpus: "0.2"

volumes:
  rbv_public:
    external: true
    name: base_rbv_public

  rbv_storage:
    external: true
    name: base_rbv_storage

  rbv_bootstrap_cache:
    name: base_rbv_bootstrap_cache