#  RBV - Ruang Baca Virtual Platform
name: service-rbv

services:
  app:
    extends:
      file: ../base/php-base.yml
      service: php-app-base
    image: rbv:v1.0.0
    container_name: rbv-app
    working_dir: /var/www/rbv
    env_file:
      - ../../apps/rbv/.env.example
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_WORKDIR: /var/www/rbv
      PUBLIC_VOLUME: /var/www/rbv/public
      APP_URL: "http://${HOST_IP}:7300"
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: database-service
      DB_USERNAME: rbv_user
      DB_PASSWORD: rbv_pass123
      DB_DATABASE: rbv_db
      SKIP_PUBLIC_SYNC: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_BUCKET: rbv
      AWS_URL: http://${HOST_IP}:9090/rbv
      AWS_ENDPOINT: http://minio:9090
    volumes:
      - rbv_storage:/var/www/rbv/storage
      - rbv_bootstrap_cache:/var/www/rbv/bootstrap/cache
      - rbv_public:/var/www/rbv/public
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 1G
          cpus: "1"

  queue:
    extends:
      file: ../base/php-base.yml
      service: php-worker-base
    image: rbv:v1.0.0
    container_name: rbv-queue
    working_dir: /var/www/rbv
    env_file:
      - ../../apps/rbv/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: rbv_user
      DB_PASSWORD: rbv_pass123
    volumes:
      - rbv_storage:/var/www/rbv/storage
      - rbv_bootstrap_cache:/var/www/rbv/bootstrap/cache
    command: >
      artisan queue:work
        --sleep=5
        --tries=3
        --timeout=120
        --max-jobs=500
        --max-time=3600
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.5"

  scheduler:
    extends:
      file: ../base/php-base.yml
      service: php-scheduler-base
    image: rbv:v1.0.0
    container_name: rbv-scheduler
    working_dir: /var/www/rbv
    env_file:
      - ../../apps/rbv/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: rbv_user
      DB_PASSWORD: rbv_pass123
    volumes:
      - rbv_storage:/var/www/rbv/storage
      - rbv_bootstrap_cache:/var/www/rbv/bootstrap/cache
    command: >
      artisan schedule:work
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.4"
        reservations:
          memory: 128M
          cpus: "0.2"

volumes:
  rbv_public:
    external: true
    name: base_rbv_public

  rbv_storage:
    external: true
    name: base_rbv_storage

  rbv_bootstrap_cache:
    name: base_rbv_bootstrap_cache