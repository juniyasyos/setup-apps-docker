# template-1 - Laravel Application
name: service-template-1

services:
  app:
    extends:
      file: ../base/php-base.yml
      service: php-app-base
    image: juniyasyos/template-1:v1.0.0
    container_name: template-1-app
    working_dir: /var/www/template-1
    env_file:
      - ../../apps/template-1/.env.example
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_WORKDIR: /var/www/template-1
      PUBLIC_VOLUME: /var/www/template-1/public
      APP_URL: "http://${HOST_IP:-localhost}:8400"
      TRUSTED_PROXIES: "*"

      DB_HOST: database-service
      DB_USERNAME: template1_user
      DB_PASSWORD: template1_password
      DB_DATABASE: template1_db

      # Jangan true kalau public volume masih perlu diisi ke shared volume Nginx.
      SKIP_PUBLIC_SYNC: "false"

      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_BUCKET: template-1
      AWS_URL: http://${HOST_IP:-localhost}:9090/template-1
      AWS_ENDPOINT: http://minio:9090
    volumes:
      - template-1_storage:/var/www/template-1/storage
      - template-1_bootstrap_cache:/var/www/template-1/bootstrap/cache
      - template-1_public:/var/www/template-1/public
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 512M
          cpus: "0.5"

  queue:
    extends:
      file: ../base/php-base.yml
      service: php-worker-base
    image: juniyasyos/template-1:v1.0.0
    container_name: template-1-queue
    working_dir: /var/www/template-1
    env_file:
      - ../../apps/template-1/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: template1_user
      DB_PASSWORD: template1_password
      DB_DATABASE: template1_db
    volumes:
      - template-1_storage:/var/www/template-1/storage
      - template-1_bootstrap_cache:/var/www/template-1/bootstrap/cache
    command: >
      artisan queue:work
        --sleep=5
        --tries=3
        --timeout=120
        --max-jobs=500
        --max-time=3600
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  scheduler:
    extends:
      file: ../base/php-base.yml
      service: php-scheduler-base
    image: juniyasyos/template-1:v1.0.0
    container_name: template-1-scheduler
    working_dir: /var/www/template-1
    env_file:
      - ../../apps/template-1/.env.example
    environment:
      DB_HOST: database-service
      DB_USERNAME: template1_user
      DB_PASSWORD: template1_password
      DB_DATABASE: template1_db
    volumes:
      - template-1_storage:/var/www/template-1/storage
      - template-1_bootstrap_cache:/var/www/template-1/bootstrap/cache
    command: >
      artisan schedule:work
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"

volumes:
  template-1_public:
    external: true
    name: base_template-1_public

  template-1_storage:
    external: true
    name: base_template-1_storage

  template-1_bootstrap_cache:
    name: base_template-1_bootstrap_cache