services:
  fe-smsp:
    image: ${FE_SMSP_IMAGE:-fe-smsp:v1.0.1}
    container_name: fe-smsp
    restart: unless-stopped

    env_file:
      - ../../apps/smsp/fe.env.example

    environment:
      VITE_API_URL: "http://${HOST_IP:-localhost}:${SMSP_HOST_PORT:-7200}"
      VITE_SSO_URL: "http://${HOST_IP:-localhost}:${SMSP_HOST_PORT:-7200}/sso/login"

    expose:
      - "80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7250/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
