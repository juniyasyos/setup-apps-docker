services:
  fe-smsp:
    image: ${FE_SMSP_IMAGE:-fe-smsp:v1.0.0}
    container_name: fe-smsp
    restart: unless-stopped

    expose:
      - "80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
