services:
  fe-smsp:
    image: ${FE_SMSP_IMAGE:-fe-smsp:v1.0.0}
    container_name: fe-smsp
    restart: unless-stopped

    env_file:
      - ../../apps/fe-smsp/.env.example
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_APP_NAME=${VITE_APP_NAME:-SMSP}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:7200}

    expose:
      - "80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7250/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
