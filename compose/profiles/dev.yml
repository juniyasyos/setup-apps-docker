# Development profile override
# Usage: docker compose --profile dev ...
# or via: ./rsch up --dev

services:
  web:
    ports:
      - "${SIIMUT_HOST_PORT:-8010}:8000"
      - "${IKP_HOST_PORT:-8210}:8200"
      - "${IAM_HOST_PORT:-8110}:8100"
      - "${LMS_HOST_PORT:-7000}:7000"

  # Enable phpMyAdmin in dev (has profile: dev, auto-starts with --profile dev)
  # phpmyadmin is always on; no profile needed

  # Enable xdebug in the future...
