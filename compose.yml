name: service-app-multi

include:
  - path: compose/base/web.yml

services:
  # Section : Apps - Production Application

  # SIIMUT
  # Image: juniyasyos/siimut:VERSION
  app-siimut:
      file: compose/apps/siimut.yml

  queue-siimut:
      file: compose/apps/siimut.yml

  scheduler-siimut:
      file: compose/apps/siimut.yml

  # IKP
  # Image: juniyasyos/ikp:VERSION
  app-ikp:
      file: compose/apps/ikp.yml

  queue-ikp:
      file: compose/apps/ikp.yml

  scheduler-ikp:
      file: compose/apps/ikp.yml

  # IAM Server
  # Image: juniyasyos/iam-server:VERSION
  app-iam:
      file: compose/apps/iam.yml

  queue-iam:
      file: compose/apps/iam.yml

  scheduler-iam:
      file: compose/apps/iam.yml

  # LMS
  # Image: juniyasyos/lms-app:VERSION
  app-lms:
      file: compose/apps/lms.yml

  queue-lms:
      file: compose/apps/lms.yml

  scheduler-lms:
      file: compose/apps/lms.yml

####################################################################################################
# Named Volumes
# Volume naming convention:
#   {app}_{type}  →  e.g. siimut_storage, ikp_public
#   Types: storage, public, bootstrap_cache
####################################################################################################
volumes:
  # ── SIIMUT ───────────────────────────────────────
  siimut_public:
    driver: local
  siimut_storage:
    driver: local
  siimut_bootstrap_cache:
    driver: local

  # ── IKP ──────────────────────────────────────────
  ikp_public:
    driver: local
  ikp_storage:
    driver: local
  ikp_bootstrap_cache:
    driver: local

  # ── IAM Server ───────────────────────────────────
  iam_public:
    driver: local
  iam_storage:
    driver: local
  iam_bootstrap_cache:
    driver: local

  # ── LMS ──────────────────────────────────────────
  lms_public:
    driver: local
  lms_storage:
    driver: local
  lms_bootstrap_cache:
    driver: local
  testapp_public:
    driver: local
  testapp_storage:
    driver: local
  testapp_bootstrap_cache:
    driver: local


####################################################################################################
# Networks - Using shared infrastructure network
####################################################################################################
networks:
  default:
    name: rsch-apps_default
    external: true
