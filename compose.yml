name: base

include:
  - path: compose/base/web.yml

services:
  # Section : Apps - Production Application

  # SIIMUT
  # Image: juniyasyos/siimut:VERSION
  app-siimut:
    extends:
      file: compose/apps/siimut.yml
      service: app

  queue-siimut:
    extends:
      file: compose/apps/siimut.yml
      service: queue

  scheduler-siimut:
    extends:
      file: compose/apps/siimut.yml
      service: scheduler

  # IKP
  # Image: juniyasyos/ikp:VERSION
  app-ikp:
    extends:
      file: compose/apps/ikp.yml
      service: app

  queue-ikp:
    extends:
      file: compose/apps/ikp.yml
      service: queue

  scheduler-ikp:
    extends:
      file: compose/apps/ikp.yml
      service: scheduler

  # IAM Server
  # Image: juniyasyos/iam-server:VERSION
  app-iam:
    extends:
      file: compose/apps/iam.yml
      service: app

  queue-iam:
    extends:
      file: compose/apps/iam.yml
      service: queue

  scheduler-iam:
    extends:
      file: compose/apps/iam.yml
      service: scheduler


  # Learning Management System berbasis Laravel yang dikustomisasi untuk kebutuhan internal institusi kesehatan
  # Image: juniyasyos/lms:VERSION
  app-lms:
    extends:
      file: compose/apps/lms.yml
      service: app

  queue-lms:
    extends:
      file: compose/apps/lms.yml
      service: queue

  scheduler-lms:
    extends:
      file: compose/apps/lms.yml
      service: scheduler

  #  RBV - Ruang Baca Virtual Platform
  # Image: juniyasyos/rbv:VERSION
  app-rbv:
    extends:
      file: compose/apps/rbv.yml
      service: app

  queue-rbv:
    extends:
      file: compose/apps/rbv.yml
      service: queue

  scheduler-rbv:
    extends:
      file: compose/apps/rbv.yml
      service: scheduler

####################################################################################################
  # Smartpresence Deskripsi
  # Image: smsp:v1.0.0
  app-smsp:
    extends:
      file: compose/apps/smsp.yml
      service: app
  
  fe-smps:
    extends:
      file: compose/apps/fe-smsp.yml
      service: fe

  queue-smsp:
    extends:
      file: compose/apps/smsp.yml
      service: queue
    networks:
      - default

  scheduler-smsp:
    extends:
      file: compose/apps/smsp.yml
      service: scheduler
    networks:
      - default
# Named Volumes
# Volume naming convention:
#   {app}_{type}  →  e.g. siimut_storage, ikp_public
#   Types: storage, public, bootstrap_cache
####################################################################################################
volumes:
  # ── SIIMUT ───────────────────────────────────────
  siimut_public:
    driver: local
  siimut_storage:
    driver: local
  siimut_bootstrap_cache:
    driver: local

  # ── IKP ──────────────────────────────────────────
  ikp_public:
    driver: local
  ikp_storage:
    driver: local
  ikp_bootstrap_cache:
    driver: local

  # ── IAM Server ───────────────────────────────────
  iam_public:
    driver: local
  iam_storage:
    driver: local
  iam_bootstrap_cache:
    driver: local

  # ── LMS ──────────────────────────────────────────
  lms_public:
    driver: local
  lms_storage:
    driver: local
  lms_bootstrap_cache:
    driver: local

  # ── RBV ──────────────────────────────────────────
  rbv_public:
    driver: local
  rbv_storage:
    driver: local
  rbv_bootstrap_cache:
    driver: local

  # ── RBV ──────────────────────────────────────────
  smsp_public:
    driver: local
  smsp_storage:
    driver: local
  smsp_bootstrap_cache:
    driver: local

####################################################################################################
# Networks - Using shared infrastructure network
####################################################################################################
networks:
  default:
    name: rsch-apps_default
    external: true
